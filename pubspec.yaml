name: notas
description: Notas sincronizadas entre Android y Windows (Flutter + Supabase).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: '>=2.8.0 <3.0.0'
  shared_preferences: '>=2.2.0 <3.0.0'
  home_widget: '>=0.7.0 <1.0.0'
  flutter_animate: '>=4.5.0 <5.0.0'
  window_manager: '>=0.5.0 <0.6.0'
  flutter_quill: '>=11.4.0 <12.0.0'
  flutter_local_notifications: '>=19.4.0 <20.0.0'
  timezone: '>=0.10.0 <0.11.0'

dev_dependencies:
  flutter_launcher_icons: '>=0.14.0 <0.15.0'

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#17141F"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  fonts:
    - family: Shrikhand
      fonts:
        - asset: assets/fonts/Shrikhand-Regular.ttf
