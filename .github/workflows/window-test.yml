name: Windows window test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare and build (DEMO mode, sample notes)
        shell: pwsh
        run: |
          ./scripts/prepare_windows.ps1
          flutter build windows --release --dart-define=DEMO=true

      - name: Open, resize and take screenshots
        shell: pwsh
        run: ./scripts/window_test.ps1 -Exe "build\windows\x64\runner\Release\Oganesson.exe"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - name: Store screenshots in the "screenshots" branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan screenshots
          git rm -r -q --cached .
          git add screenshots
          git commit -q -m "screenshots $env:GITHUB_RUN_NUMBER"
          git push -f -q origin screenshots
