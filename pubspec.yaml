name: notas
description: Oganesson TakeNotes — synced notes for Android and Windows (Flutter + Supabase).
publish_to: 'none'
version: 2.3.0+29

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: '>=2.18.0 <3.0.0'
  shared_preferences: '>=2.2.0 <3.0.0'
  home_widget: '>=0.7.0 <1.0.0'
  flutter_animate: '>=4.5.0 <5.0.0'
  window_manager: '>=0.5.0 <0.6.0'
  flutter_quill: '>=11.4.0 <12.0.0'
  flutter_local_notifications: '>=19.4.0 <20.0.0'
  timezone: '>=0.10.0 <0.11.0'
  url_launcher: '>=6.3.3 <7.0.0'
  package_info_plus: '>=10.2.2 <11.0.0'
  path_provider: '>=2.1.6 <3.0.0'
  open_filex: '>=5.0.0 <6.0.0'
  cryptography: '>=2.9.0 <3.0.0'
  image_picker: '>=1.2.4 <2.0.0'
  pasteboard: '>=0.6.2 <0.7.0'
  # Comprime las imágenes de las notas (y genera las del README).
  image: '>=4.13.1 <5.0.0'
  quill_native_bridge: '>=11.2.0 <12.0.0'
  desktop_drop: '>=0.8.4 <0.9.0'
  crop_your_image: '>=2.0.1 <3.0.0'
  flutter_secure_storage: '>=11.2.0 <12.0.0'
  tray_manager: '>=0.5.0 <0.6.0'
  hotkey_manager: '>=0.2.3 <0.3.0'
  windows_single_instance: '>=1.2.0 <2.0.0'
  # 1.9 needs compileSdk 37 (scripts/patch_android.py); 1.8 breaks the Kotlin build.
  receive_sharing_intent: '>=1.9.0 <2.0.0'
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  record: ^7.2.0
  pdf: ^3.13.1

# pdf needs xml 7; flutter_local_notifications_windows 1.x pins xml 6 but only
# uses API that is unchanged in 7 (checked by the Windows build).
dependency_overrides:
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: '>=0.14.0 <0.15.0'
  flutter_lints: '>=6.0.0 <7.0.0'
flutter:
  uses-material-design: true
  assets:
    # Icono de la bandeja del sistema (Windows).
    - assets/icon/tray.ico
  fonts:
    - family: Shrikhand
      fonts:
        - asset: assets/fonts/Shrikhand-Regular.ttf
