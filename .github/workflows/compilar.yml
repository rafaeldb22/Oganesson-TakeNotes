name: Compilar BabuNotes

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/probar-ventana.yml'
      - 'scripts/probar_ventana.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar proyecto Android
        run: bash scripts/preparar.sh android

      - name: Firma fija (para poder actualizar la app sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp plataforma/android/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}

      - run: cp build/app/outputs/flutter-apk/app-release.apk BabuNotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: BabuNotes.apk

  windows:
    name: App de Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar proyecto Windows
        shell: pwsh
        run: ./scripts/preparar_windows.ps1

      - name: Compilar
        shell: pwsh
        run: >
          flutter build windows --release
          --build-number=${{ github.run_number }}

      - name: Empaquetar (con las DLL de Visual C++ incluidas)
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $out }
          }
          Compress-Archive -Path "$out\*" -DestinationPath BabuNotes-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: BabuNotes-Windows.zip

  publicar:
    name: Publicar descarga
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BabuNotes v${{ github.run_number }}
          body: |
            - **BabuNotes.apk** → instálalo en el móvil.
            - **BabuNotes-Windows.zip** → descomprímelo y abre `BabuNotes.exe`.
          files: |
            dist/BabuNotes.apk
            dist/BabuNotes-Windows.zip
